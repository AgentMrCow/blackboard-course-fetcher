name: Bug report
description: Report a reproducible fetcher or local dashboard problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach storage-state files, credentials, signed URLs, grades, submissions, or private course material.

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.2.0 or a commit SHA
    validations:
      required: true

  - type: dropdown
    id: course-view
    attributes:
      label: Blackboard course view
      options:
        - Ultra
        - Classic / Original
        - Both
        - Unknown
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Node.js version
      placeholder: Windows 11, Node.js 24.0.0
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic course names and identifiers.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove cookies, tokens, signed query strings, student data, and course material.
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed authentication data, student data, and private course content.
          required: true

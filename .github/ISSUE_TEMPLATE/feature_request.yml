name: Feature request
description: Propose a focused compatibility or usability improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user-visible limitation without including private course data.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ultra fetching
        - Classic fetching
        - Attachments and browser fallbacks
        - Local dashboard
        - Archive format and search
        - Documentation and setup
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request only concerns content the authenticated user is authorized to access.
          required: true
